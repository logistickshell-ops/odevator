    <meta name="theme-color" content="#4F46E5" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="МетеоОдевайка — умный сервис подбора детской одежды по погоде. Работает как Telegram Mini App." />
    <title>МетеоОдевайка — Умный подбор одежды для детей по погоде</title>
    
    <!-- Telegram Web App SDK - обязательный скрипт для интеграции в Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Google Fonts for child/parent themed friendly interface -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    
    <style>
      html, body {
        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
    
    <!-- Telegram Mini App Initialization Script -->
    <script>
      // Инициализация Telegram Web App при загрузке страницы
      (function() {
        if (window.Telegram && window.Telegram.WebApp) {
          const tg = window.Telegram.WebApp;
          
          // Готовность приложения
          tg.ready();
          
          // Раскрыть на весь экран
          tg.expand();
          
          // Отключить закрытие приложения свайпом вниз (для лучшего UX)
          if (tg.disableVerticalSwipes) {
            tg.disableVerticalSwipes();
          }
          
          // Установить цветовую схему в соответствии с темой Telegram
          if (tg.setHeaderColor) {
            tg.setHeaderColor('#ffffff');
          }
          if (tg.setBackgroundColor) {
            tg.setBackgroundColor('#f8fafc');
          }
          
          // Включить подтверждение закрытия приложения
          if (tg.enableClosingConfirmation) {
            tg.enableClosingConfirmation();
          }
        }
      })();
    </script>

h"},{id:5,title:"Тепловой удар у детей",text:"В жару дети быстро перегреваются. Признаки: сильная жажда, головная боль, тошнота, покраснение кожи. Срочно в тень, дайте воды, приложите прохладный компресс.",icon:"☀️",category:"health"},{id:6,title:"Водный баланс в жару",text:"В жаркую погоду ребенок должен пить каждые 15-20 минут. Предлагайте воду даже если не просит. Признак обезвоживания — редкое мочеиспускание и темная моча.",icon:"💧",category:"health"},{id:7,title:"Солнечные ожоги у детей",text:"Кожа ребенка тоньше и быстрее обгорает. Используйте кремы с SPF 50+, одевайте легкую закрытую одежду. При ожоге — прохладный компресс и увлажняющий крем.",icon:"🧴",category:"health"},{id:8,title:"Терморегуляция у младенцев",text:"У детей до года терморегуляция несовершенна. Они быстрее замерзают и перегреваются. Проверяйте состояние каждые 5-10 минут прогулки.",icon:"👶",category:"health"},{id:9,title:"Капризы от погоды",text:"Резкая смена погоды может вызвать капризы. Дети метеочувствительны: перепады давления и температуры влияют на их самочувствие и настроение.",icon:"😫",category:"health"},{id:10,title:"Иммунитет и прогулки",text:"Ежедневные прогулки укрепляют иммунитет. Даже в плохую погоду 15-20 минут на свежем воздухе полезны, если ребенок правильно одет.",icon:"🛡️",category:"health"},{id:11,title:"Ветер + влажность = холоднее",text:"При ветре и высокой влажности ощущаемая температура ниже реальной. В такую погоду добавляйте ветрозащитный слой даже в плюсовую температуру.",icon:"💨",category:"weather"},{id:12,title:"Без шапки при ветре",text:"Даже в +5°C при сильном ветре ребенок теряет до 30% тепла через голову. Шапка обязательна, даже если кажется, что солнце греет.",icon:"🧢",category:"weather"},{id:13,title:"Погода в 0°C — самая коварная",text:"При нулевой температуре и мокром снеге одежда промокает мгновенно. Обязателен водоотталкивающий верхний слой и непромокаемая обувь.",icon:"🌨️",category:"weather"},{id:14,title:"Защита от ветра",text:"Ветрозащитный слой должен быть сверху. Мембранные ткани лучше всего сохраняют тепло и не дают продувать даже при сильном порывистом ветре.",icon:"🧥",category:"weather"},{id:15,title:"Снег и отражение солнца",text:"В солнечную погоду снег отражает до 80% ультрафиолета. Обязательно используйте солнцезащитный крем, даже зимой!",icon:"⛷️",category:"weather"},{id:16,title:"Слякоть и лужи",text:"В слякотную погоду резиновая обувь обязательна. Мокрые ноги — гарантия переохлаждения. Высокие резиновые сапоги с утеплителем — лучший выбор.",icon:"☔",category:"weather"},{id:17,title:"Погода в горах",text:"В горах погода меняется каждые 15 минут. Возьмите с собой дождевик, теплый слой и запасные носки, даже если на старте светит солнце.",icon:"🏔️",category:"weather"},{id:18,title:"Гололед и безопасность",text:"В гололед надевайте обувь с рифленой подошвой. Детям до 3 лет лучше использовать специальные ледоходы или шипы на обувь для устойчивости.",icon:"❄️",category:"weather"},{id:19,title:"Мороз и солнце",text:"В морозный солнечный день температура может казаться теплее. Но это обман! Ветрозащитный слой и защита лица обязательны.",icon:"☀️❄️",category:"weather"},{id:20,title:"Гроза и дети",text:"При грозе немедленно возвращайтесь домой. Даже легкие разряды молнии могут быть опасны. Дождь при грозе — не главная угроза.",icon:"⚡",category:"weather"},{id:21,title:"Правило слоев для детей",text:"Одевайте ребенка на 1 слой больше, чем себя, если ему до 1 года. Для детей постарше — столько же слоев, сколько и у взрослого, но с учетом активности.",icon:"🧅",category:"clothing"},{id:22,title:"Обувь по размеру",text:"У ребенка должна быть возможность пошевелить пальцами в обуви. Оптимальный запас — 0.5-1 см. Тесная обувь замедляет кровообращение и быстрее охлаждает ноги.",icon:"👢",category:"clothing"},{id:23,title:"Водоотталкивающий слой",text:"При температуре около 0°C и мокром снеге обязателен верхний водоотталкивающий слой. Промокшая одежда отводит тепло в 2 раза быстрее сухой.",icon:"🧥",category:"clothing"},{id:24,title:"Натуральные ткани",text:"Белье и первый слой должны быть из натуральных тканей (хлопок, лен, меринос). Они впитывают влагу и позволяют коже дышать.",icon:"🌿",category:"clothing"},{id:25,title:"Варежки или перчатки?",text:"Для детей до 3 лет — только варежки! Пальчики в них греются вместе. Перчатки лучше для детей постарше, которые могут сами их поправлять.",icon:"🧤",category:"clothing"},{id:26,title:"Шапка для зимы",text:"Зимняя шапка должна закрывать уши и лоб. Шерстяная шапка-ушанка лучше, чем вязаная — она не продувается ветром.",icon:"🎩",category:"clothing"},{id:27,title:"Одежда для активных игр",text:"Для активных игр выбирайте комбинезоны с мембраной. Они не ограничивают движения и при этом защищают от ветра и влаги.",icon:"🤸",category:"clothing"},{id:28,title:"Светоотражатели",text:"В темное время суток обязательно наличие светоотражающих элементов на одежде. Это может спасти жизнь на дороге.",icon:"✨",category:"clothing"},{id:29,title:"Комбинезон или раздельный комплект?",text:"Для детей до года — комбинезон лучше, он не задирается. Для активных малышей — раздельный комплект, чтобы снимать куртку при перегреве.",icon:"🧩",category:"clothing"},{id:30,title:"Шарф вместо балаклавы",text:"Шарф детям лучше не использовать — он может перекрыть дыхание. Вместо него используйте балаклаву или шейный платок (гамашу) из флиса.",icon:"🧣",category:"clothing"},{id:31,title:"Активность и одежда",text:"Если ребенок бегает и играет — одевайте легче, чем для спокойной прогулки. От активных движений дети потеют и перегреваются, а потом легко простужаются от ветра.",icon:"🏃",category:"general"},{id:32,title:"Правило 3-х минут",text:"После выхода на улицу подождите 3 минуты и оцените состояние ребенка. Это время нужно, чтобы организм перестроился с теплого помещения на холодный воздух.",icon:"⏱️",category:"general"},{id:33,title:"Переодевание после прогулки",text:"После прогулки обязательно переоденьте ребенка в сухую одежду. В мокрой одежде он может замерзнуть даже дома из-за испарения влаги.",icon:"👕",category:"general"},{id:34,title:"Еда перед прогулкой",text:"Не кормите ребенка плотно за 30-40 минут до прогулки. Активные игры на полный желудок могут вызвать дискомфорт и срыгивание.",icon:"🍎",category:"general"},{id:35,title:"Прогулка в дождь",text:"В дождливую погоду гулять можно и нужно! Непромокаемый комбинезон и резиновые сапоги — и ребенок счастлив. Лучше промокнуть, но проветриться.",icon:"🌧️",category:"general"},{id:36,title:"Сон на улице",text:"Детям до года полезно спать на улице. Оптимальная температура — от -5°C до +20°C. Укутывайте ребенка правильно, проверяйте загривок.",icon:"😴",category:"general"},{id:37,title:"Температура в помещении",text:"После прогулки не заходите сразу в жаркое помещение. Сначала разденьте ребенка в прихожей, дайте адаптироваться 5-10 минут.",icon:"🏠",category:"general"},{id:38,title:"Коляска в жару",text:"В жару коляска нагревается как парник. Не накрывайте ее плотной тканью — это ограничивает циркуляцию воздуха. Используйте специальные сетки или зонты.",icon:"🛒",category:"general"},{id:39,title:"Прогулка с другими детьми",text:"В компании детей активность всегда выше. Одевайте их чуть легче обычного — они будут бегать, смеяться и быстрее нагреваться.",icon:"👫",category:"general"},{id:40,title:"Эмоциональное состояние",text:"Если ребенок плачет или капризничает на улице — проверьте: возможно, ему холодно или жарко. Эмоции — первый сигнал дискомфорта.",icon:"😢",category:"general"},{id:41,title:"Песочница и одежда",text:"Для игр в песочнице выбирайте одежду, которую не жалко испачкать. Джинсы и плотная куртка лучше защищают от песка, чем легкие ткани.",icon:"🏖️",category:"general"},{id:42,title:"Самокат и велосипед",text:"При катании ребенок активно двигается. Надевайте на 1 слой меньше обычного и не забывайте о шлеме, наколенниках и налокотниках.",icon:"🛴",category:"general"},{id:43,title:"Прогулка перед сном",text:"Вечерняя прогулка за 1-2 часа до сна помогает ребенку успокоиться и крепче спать. Даже 15 минут на воздухе улучшают качество сна.",icon:"🌙",category:"general"},{id:44,title:"Обувь для бега",text:"Для активного бега обувь должна быть легкой и гибкой. Кроссовки с хорошей амортизацией защищают суставы и не натирают ноги.",icon:"👟",category:"general"},{id:45,title:"Время в коляске",text:"Не держите ребенка долго в коляске без движения. Каждые 20-30 минут останавливайтесь, давайте ему подвигаться, менять позу.",icon:"🚼",category:"general"},{id:46,title:"Прогулка в парке",text:"В парке всегда прохладнее, чем в городе, и выше влажность. Одевайте ребенка чуть теплее и обязательно защищайте от клещей в сезон.",icon:"🌳",category:"general"},{id:47,title:"Снежки и активные игры",text:"Игра в снежки и лепка снеговика — отличная активность. Но следите, чтобы варежки не промокали, и вовремя меняйте их на сухие.",icon:"☃️",category:"general"},{id:48,title:"Прогулка с собакой",text:"Если гуляете с собакой, ребенок бегает больше обычного. Снимайте с него лишний слой одежды, чтобы избежать перегрева.",icon:"🐕",category:"general"},{id:49,title:"Мороженое и погода",text:"Не давайте ребенку холодное и горячее во время активной прогулки. Резкие перепады температур вредны для горла.",icon:"🍦",category:"general"},{id:50,title:"Радость от прогулки",text:"Прогулка — это не только физическая польза, но и радость. Улыбайтесь ребенку, показывайте ему мир, и он будет любить время на улице в любую погоду!",icon:"😊",category:"general"}];function od(){const[F,Q]=je.useState(null),[g,ne]=je.useState(!0),[H,D]=je.useState(null),[G,V]=je.useState("Санкт-Петербург"),[A,ae]=je.useState("Санкт-Петербург"),[Y,s]=je.useState("clothing"),S=(()=>{const B=new Date().getHours();return B>=6&&B<12?"morning":B>=12&&B<17?"day":B>=17&&B<21?"evening":"night"})(),R=async B=>{ne(!0),D(null);try{const ve=await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(B)}&appid=undefined&units=metric&lang=ru`);if(!ve.ok)throw new Error(`HTTP error! status: ${ve.status}`);
